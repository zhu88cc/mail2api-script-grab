name: grab-db
on:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download installer
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/dofastted/mail2api-releases/releases/download/desktop-v1.0.5/mail2api_1.0.5_x64-setup.exe" -OutFile setup.exe
      - name: Silent install
        shell: pwsh
        run: |
          Start-Process .\setup.exe -ArgumentList "/S","/D=C:\mail2api" -Wait -Verb RunAs
          Get-ChildItem C:\mail2api -ErrorAction SilentlyContinue | Select-Object Name
      - name: Inspect layout
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "mail2api.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - name: Run server 100s
        shell: pwsh
        run: |
          $exe = "C:\mail2api\mail2api.exe"
          Write-Host "using: $exe"
          $p = Start-Process $exe -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          Start-Sleep -Seconds 100
          Get-Content server.log -ErrorAction SilentlyContinue | Select-Object -First 25
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Collect db
        shell: pwsh
        run: |
          $db = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter "mail2api.db" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "db: $db"
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item $db out\mail2api.db -Force
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: mail2api-db
          path: out/mail2api.db
