name: grab-db
on:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download installer
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/dofastted/mail2api-releases/releases/download/desktop-v1.0.5/mail2api_1.0.5_x64-setup.exe" -OutFile setup.exe
      - name: Silent install
        shell: pwsh
        run: |
          Start-Process .\setup.exe -ArgumentList "/S","/D=C:\mail2api" -Wait -Verb RunAs
          Get-ChildItem C:\mail2api -ErrorAction SilentlyContinue | Select-Object Name
      - name: Inspect layout
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "mail2api.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - name: Run server 100s
        shell: pwsh
        env:
          MAIL2API_ENCRYPTION_KEY: e5c17165f931d963a25a6c0ed726bcf3506034c16d4a0b193e29865d74704faf
        run: |
          $exe = "C:\mail2api\mail2api.exe"
          Write-Host "using: $exe"
          $p = Start-Process $exe -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          Start-Sleep -Seconds 100
          Get-Content server.log -ErrorAction SilentlyContinue
          Get-Content server.err -ErrorAction SilentlyContinue | Select-Object -First 10
          $mm = Select-String -Path server.log, server.err -Pattern 'm2a_[A-Za-z0-9_-]+' -ErrorAction SilentlyContinue | Select-Object -First 1
          $tok = if ($mm -and $mm.Matches.Count -gt 0) { $mm.Matches[0].Value } else { "" }
          Write-Host "token found: $($tok.Length) chars"
          try { (Invoke-WebRequest -Uri "http://127.0.0.1:8080/healthz" -OutFile healthz.json -SkipHttpErrorCheck) | Out-Null; Get-Content healthz.json } catch { Write-Host "healthz failed" }
          try { Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/v1/admin/scripts" -OutFile scripts_noauth.json -SkipHttpErrorCheck; Write-Host "noauth saved: $((Get-Item scripts_noauth.json).Length) bytes" } catch { Write-Host "noauth failed: $($_.Exception.Message)" }
          if ($tok) { Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/v1/admin/scripts" -Headers @{ Authorization = "Bearer $tok" } -OutFile scripts_auth.json -SkipHttpErrorCheck }
          Copy-Item server.log out_server.log -Force -ErrorAction SilentlyContinue
          Get-ChildItem scripts_*.json, healthz.json, out_server.log -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-ChildItem C:\mail2api -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem . -ErrorAction SilentlyContinue | Select-Object Name, Length
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Collect data dir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process mail2api, cragnet, mail2api-desktop -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $dir = (Get-ChildItem . -Recurse -Directory -Filter "data" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "data dir: $dir"
          Get-ChildItem $dir -Force -ErrorAction SilentlyContinue | Select-Object Name, Length
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item "$dir\*" out\ -Force -ErrorAction SilentlyContinue
          Get-ChildItem out -ErrorAction SilentlyContinue | Select-Object Name, Length
      - name: Upload scripts json
        uses: actions/upload-artifact@v4
        with:
          name: scripts-json
          path: |
            scripts_*.json
            healthz.json
            out_server.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mail2api-db
          path: out/
